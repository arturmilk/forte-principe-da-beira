<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a120c">
<title>A Planta Perdida de Sambuceti</title>
<style>
  :root { --bg: rgba(26,18,12,.86); --paper: #efe0bd; --ink: #2a1a08; --acc: #d98a4a; --gold: #ffd36b; --line: rgba(255,255,255,.14); --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px); --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #f4ead8; font-family: Georgia, "Times New Roman", serif; user-select: none; -webkit-user-select: none; overscroll-behavior: none; touch-action: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .gold { color: var(--gold); } .blue { color: #8ad7ff; } .small { font-size: 12px; opacity: .75; }
  .btn { background: rgba(255,255,255,.12); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; font-size: 16px; margin: 4px 6px 0 0; }
  .btn.primary { background: var(--acc); color: #1c120b; font-weight: 700; border: 0; }
  .btn.ghost { background: transparent; } .btn.small { padding: 6px 10px; font-size: 13px; } .btn.big { padding: 16px 28px; font-size: 20px; }
  .btn:active, .opt:active { transform: scale(.97); }
  /* carregamento */
  #loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #1a120c; font-size: 18px; text-align: center; transition: opacity .6s; }
  #loading.off { opacity: 0; pointer-events: none; }
  #loading .bar { width: 240px; height: 6px; background: #3a2a1e; border-radius: 3px; margin: 12px auto 0; overflow: hidden; } #loading .bar i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .2s; }
  /* título */
  .screen { position: fixed; inset: 0; z-index: 30; display: none; }
  #title { background: linear-gradient(180deg, rgba(10,6,2,.15), rgba(10,6,2,.78)); align-content: end; text-align: center; padding: 24px 16px calc(24px + var(--safe-b)); }
  #title.on { display: grid; }
  #title h1 { margin: 0; font-size: clamp(30px, 7vw, 54px); letter-spacing: .5px; text-shadow: 0 3px 16px #000; line-height: 1.05; }
  #title .tag { margin: 8px 0 18px; font-size: clamp(14px, 2.4vw, 18px); opacity: .9; text-shadow: 0 2px 8px #000; }
  #title .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; } #title .btn { font-size: 18px; padding: 12px 22px; }
  #title .credit { margin-top: 14px; font-size: 11px; opacity: .6; }
  /* HUD */
  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #hud.hide { display: none; }
  #hud > * { pointer-events: none; }
  #hud button, #prompt { pointer-events: auto; }
  .box { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(4px); }
  #objbox { position: absolute; top: calc(10px + var(--safe-t)); left: calc(10px + var(--safe-l)); max-width: min(60vw, 380px); padding: 8px 12px; display: flex; gap: 10px; align-items: center; font-size: 13px; line-height: 1.35; }
  #objArrow { flex: none; width: 26px; height: 26px; display: grid; place-items: center; color: #ff6a4a; font-size: 22px; transition: transform .1s; }
  #objDist { font-size: 11px; opacity: .75; }
  #phase { position: absolute; top: calc(184px + var(--safe-t)); right: calc(8px + var(--safe-r)); max-width: 150px; padding: 4px 10px; font-size: 11px; text-align: right; } #zone { font-weight: 700; font-size: 12px; }
  #topbtns { position: absolute; top: calc(8px + var(--safe-t)); right: calc(8px + var(--safe-r)); display: flex; gap: 6px; }
  #topbtns button { width: 44px; height: 44px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); font-size: 20px; position: relative; }
  #invBadge { position: absolute; right: -4px; top: -4px; background: var(--acc); color: #1c120b; font-size: 11px; font-weight: 700; border-radius: 9px; min-width: 18px; padding: 0 4px; }
  #invBadge:empty { display: none; }
  #mmwrap { position: absolute; top: calc(64px + var(--safe-t)); right: calc(8px + var(--safe-r)); width: 112px; height: 112px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,255,255,.3); background: #2b3a20; }
  #mmwrap canvas { width: 100%; height: 100%; display: block; }
  #prompt { position: absolute; left: 50%; bottom: calc(26% + var(--safe-b)); transform: translateX(-50%); padding: 10px 18px; font-size: 16px; opacity: 0; transition: opacity .15s; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  #prompt.on { opacity: 1; }
  #btnAct { position: absolute; right: calc(18px + var(--safe-r)); bottom: calc(22px + var(--safe-b)); width: 84px; height: 84px; border-radius: 50%; background: rgba(217,138,74,.5); border: 3px solid rgba(255,255,255,.5); font-size: 34px; }
  #btnAct.hot { background: var(--acc); box-shadow: 0 0 22px rgba(255,211,107,.8); }
  #btnRun { position: absolute; right: calc(112px + var(--safe-r)); bottom: calc(22px + var(--safe-b)); width: 52px; height: 52px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); font-size: 22px; }
  #btnRun.on { background: var(--acc); }
  #btnPlanta { position: absolute; right: calc(18px + var(--safe-r)); bottom: calc(118px + var(--safe-b)); padding: 10px 14px; border-radius: 12px; background: var(--acc); color: #1c120b; border: 0; font-weight: 700; display: none; animation: pulse 1.2s infinite; }
  #btnPlanta.on { display: block; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .zone { position: fixed; z-index: 9; display: none; touch-action: none; }
  body.touch .zone { display: block; }
  #joyzone { left: 0; bottom: 0; width: 46%; height: 62%; } #lookzone { right: 0; bottom: 0; width: 54%; height: 78%; z-index: 8; }
  #joy { position: fixed; display: none; width: 110px; height: 110px; border-radius: 50%; border: 2px solid rgba(255,255,255,.45); background: rgba(255,255,255,.08); pointer-events: none; z-index: 12; }
  #stick { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.5); }
  body:not(.touch) #btnRun { display: none; } body:not(.touch) #btnAct { width: 64px; height: 64px; font-size: 26px; }
  #toast { position: fixed; z-index: 40; left: 50%; top: calc(20% + var(--safe-t)); transform: translate(-50%, -10px); padding: 10px 18px; background: var(--bg); border: 1px solid var(--gold); border-radius: 12px; opacity: 0; transition: .25s; font-size: 15px; text-align: center; max-width: 90vw; pointer-events: none; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  /* diálogo */
  #dlg { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; display: none; padding: 0 calc(10px + var(--safe-r)) calc(10px + var(--safe-b)) calc(10px + var(--safe-l)); }
  #dlg.on { display: block; }
  #dlgBox { max-width: 860px; margin: 0 auto; display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 12px; background: rgba(239,224,189,.97); color: var(--ink); border-radius: 14px; border: 3px solid #7a5230; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #dlgPortrait { width: 110px; height: 150px; border-radius: 10px; background: #5b6b3e center top / auto 220% no-repeat; border: 2px solid #7a5230; align-self: start; }
  #dlgName { font-weight: 700; font-size: 17px; } #dlgRole { font-size: 12px; opacity: .7; margin-bottom: 6px; }
  #dlgText { font-size: 16px; line-height: 1.45; min-height: 66px; max-height: 32vh; overflow: auto; touch-action: pan-y; }
  #dlgOpts { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .opt { text-align: left; background: #d9c493; border: 1px solid #a88a52; border-radius: 9px; padding: 9px 12px; font-size: 15px; color: var(--ink); }
  .opt:hover { background: #e6d3a5; }
  @media (max-width: 560px) { #topbtns { gap: 4px; } #topbtns button { width: 38px !important; height: 38px !important; font-size: 17px !important; } #mmwrap { top: calc(56px + var(--safe-t)); width: 96px; height: 96px; } #phase { top: calc(158px + var(--safe-t)); } #objbox { max-width: calc(100vw - 190px) !important; font-size: 11.5px !important; } #dlgBox { grid-template-columns: 72px 1fr; gap: 8px; padding: 9px; } #dlgPortrait { width: 72px; height: 100px; } #dlgText { font-size: 14.5px; } .opt { font-size: 14px; padding: 8px 10px; } #objbox { max-width: 56vw; font-size: 12px; } #phase { display: none; } }
  /* cartões, notas, painel */
  #card, #note, #endScreen { position: fixed; inset: 0; z-index: 35; display: none; place-items: center; background: rgba(8,5,2,.88); padding: 20px; }
  #card.on, #note.on, #endScreen.on { display: grid; }
  .sheet { max-width: 640px; width: 100%; background: var(--paper); color: var(--ink); border: 3px solid #7a5230; border-radius: 14px; padding: 20px 22px; box-shadow: 0 10px 40px #000; max-height: 90vh; overflow: auto; touch-action: pan-y; }
  .sheet h2 { margin: 0 0 10px; font-size: 22px; } .sheet p { font-size: 17px; line-height: 1.5; margin: 0 0 14px; white-space: pre-wrap; }
  #card .sheet { background: #1c140c; color: #f4ead8; border-color: #8a6a3a; } #cardTitle { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
  #panel { position: fixed; inset: 0; z-index: 32; display: none; background: rgba(8,5,2,.86); padding: calc(10px + var(--safe-t)) 10px calc(10px + var(--safe-b)); }
  #panel.on { display: grid; place-items: center; }
  #panelBox { width: min(720px, 100%); max-height: 100%; background: var(--paper); color: var(--ink); border: 3px solid #7a5230; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
  #tabs { display: flex; gap: 2px; background: #c8b07a; padding: 6px 6px 0; } #tabs button { flex: 1; padding: 10px 4px; background: #d9c493; border: 0; border-radius: 9px 9px 0 0; color: var(--ink); font-size: 14px; } #tabs button.on { background: var(--paper); font-weight: 700; }
  #panelBody { padding: 14px 16px; overflow: auto; touch-action: pan-y; flex: 1; } #panelBody h3 { margin: 10px 0 6px; font-size: 16px; border-bottom: 1px solid #b89a5c; } #panelBody p { margin: 0 0 8px; line-height: 1.45; } .big { font-size: 18px; font-weight: 700; }
  #panelClose { margin: 0 12px 12px; align-self: flex-end; background: var(--acc); color: #1c120b; border: 0; border-radius: 10px; padding: 8px 18px; font-weight: 700; }
  .check { list-style: none; padding: 0; margin: 0 0 8px; } .check li { padding: 4px 0; } .check li.ok { opacity: .55; text-decoration: line-through; }
  .cod details { background: rgba(0,0,0,.06); border-radius: 8px; padding: 6px 10px; margin: 4px 0; } .cod summary { cursor: pointer; font-weight: 700; } .cod p { font-size: 14px; }
  .inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; } .slot { background: #d9c493; border: 1px solid #a88a52; border-radius: 10px; padding: 8px 4px; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 4px; } .slot span { font-size: 30px; } .slot small { font-size: 11px; text-align: center; line-height: 1.15; }
  .invdesc { margin-top: 10px; padding: 10px; background: rgba(0,0,0,.07); border-radius: 10px; min-height: 64px; line-height: 1.45; }
  .bigmap { width: 100%; max-width: 520px; display: block; margin: 0 auto; border-radius: 10px; background: #2b3a20; } .help p { font-size: 14px; }
  #panelBody .btn { color: var(--ink); background: #d9c493; border-color: #a88a52; } #panelBody .btn.primary { background: var(--acc); }
  /* minigames */
  #mg { position: fixed; inset: 0; z-index: 38; display: none; place-items: center; background: rgba(8,5,2,.9); padding: 12px; }
  #mg.on { display: grid; }
  .mgbox { width: min(560px, 100%); background: var(--paper); color: var(--ink); border: 3px solid #7a5230; border-radius: 14px; padding: 14px; max-height: 98vh; overflow: auto; }
  .mgtitle { font-size: 20px; font-weight: 700; margin-bottom: 6px; } .mghint { font-size: 14px; line-height: 1.4; margin-bottom: 10px; } .mgfoot { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; }
  .mgbox .btn { color: var(--ink); background: #d9c493; border-color: #a88a52; } .mgbox .btn.primary { background: var(--acc); } .mgbox .btn.ghost { background: transparent; } .mgmsg { min-height: 22px; font-size: 14px; color: #8a2a1a; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; } .chip.on { background: var(--acc) !important; font-weight: 700; }
  .dials { display: flex; justify-content: center; gap: 18px; margin: 10px 0; } .dial { display: flex; flex-direction: column; align-items: center; gap: 6px; } .dial .num { font-size: 40px; font-weight: 700; width: 74px; text-align: center; background: #2a1a08; color: var(--gold); border-radius: 10px; padding: 6px 0; } .dial .chip { font-size: 20px; padding: 6px 22px; }
  .shake { animation: shake .35s; } @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  #fade { position: fixed; inset: 0; z-index: 45; background: #000; opacity: 0; pointer-events: none; transition: opacity .7s; } #fade.on { opacity: 1; pointer-events: auto; }
  #endScreen { background: #1c140c; } #endScreen .sheet { text-align: center; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.3/build/index.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="loading"><div><div>Carregando o Real Forte Príncipe da Beira…</div><div class="bar"><i id="lbar"></i></div></div></div>

<div id="title" class="screen">
  <h1>A Planta Perdida<br>de Sambuceti</h1>
  <div class="tag">Real Forte Príncipe da Beira · Guaporé, agosto de 1783</div>
  <div class="btns">
    <button class="btn primary" id="btnNew">Novo jogo</button>
    <button class="btn" id="btnContinue" style="display:none">Continuar</button>
    <button class="btn" id="btnHow">Como jogar</button>
    <button class="btn" id="btnQuality">Gráficos: altos</button>
  </div>
  <div class="credit">Aventura histórica em primeira pessoa · personagens 2D e texturas gerados no Higgsfield</div>
</div>

<div id="hud" class="hide">
  <div id="objbox" class="box"><div id="objArrow">▲</div><div><div id="objText"></div><div id="objDist"></div></div></div>
  <div id="phase" class="box"><div id="phaseLbl"></div><div id="zone"></div></div>
  <div id="topbtns"><button id="btnInv" title="Inventário (I)">🎒<span id="invBadge"></span></button><button id="btnJ" title="Diário (J)">📖</button><button id="btnMap" title="Mapa (M)">🗺️</button><button id="btnMenu" title="Menu (Esc)">☰</button></div>
  <div id="mmwrap"><canvas id="mm" width="150" height="150"></canvas></div>
  <div id="prompt" class="box"><span id="promptTxt"></span></div>
  <button id="btnPlanta">🧩 Montar a planta</button>
  <button id="btnRun" title="Correr">🏃</button>
  <button id="btnAct" title="Agir (E)">✋</button>
</div>
<div id="joyzone" class="zone"></div><div id="lookzone" class="zone"></div>
<div id="joy"><div id="stick"></div></div>

<div id="toast"></div>

<div id="dlg"><div id="dlgBox"><div id="dlgPortrait"></div><div><div id="dlgName"></div><div id="dlgRole"></div><div id="dlgText"></div><div id="dlgOpts"></div></div></div></div>

<div id="note"><div class="sheet"><h2 id="noteTitle"></h2><p id="noteText"></p><button class="btn primary" id="noteOk">Ok</button></div></div>
<div id="card"><div class="sheet"><div id="cardTitle"></div><p id="cardText"></p><button class="btn primary" id="cardOk">Continuar</button></div></div>

<div id="panel"><div id="panelBox">
  <div id="tabs"><button data-t="obj">Diário</button><button data-t="inv">Itens</button><button data-t="map">Mapa</button><button data-t="menu">Menu</button></div>
  <div id="panelBody"></div><button id="panelClose">Fechar ✕</button>
</div></div>

<div id="mg"></div>
<div id="fade"></div>
<div id="endScreen"><div class="sheet"><div id="endStats"></div><button class="btn primary" id="endAgain">Voltar ao início</button></div></div>

<script type="module" src="game.js"></script>
</body>
</html>
